# MyMy Windows — analyze + test gate, then a release build uploaded as
# an artifact (the release folder containing mymy.exe).
# Pinned to Flutter 3.47.6, the SDK version verified locally.
# NOTE: Phase 1 Windows is a stub (windows-phase2-pending): the built
# exe runs and honestly reports that Windows usage is not implemented
# yet. Per-process bytes land in Phase 2 (native ETW/IP Helper).
name: Build Windows

# MANUAL-ONLY (Dennis, 2026-11-02): no push trigger — run from Actions > Run workflow.
on:
  workflow_dispatch:

concurrency:
  group: mymy-build-windows
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: mymy-windows-release
          path: build/windows/x64/runner/Release
          retention-days: 30
